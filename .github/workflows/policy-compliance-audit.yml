name: Kubernetes policy validation
on:
  push:
  pull_request:
  schedule:
    - cron: '42 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-policies:
    name: YAML checks and Kyverno fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: kyverno/action-install-cli@v0.2.0
        with:
          release: v1.14.4
      - run: make setup
      - run: make test
  misconfiguration-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: network-policies
          severity: HIGH,CRITICAL
          exit-code: '1'
