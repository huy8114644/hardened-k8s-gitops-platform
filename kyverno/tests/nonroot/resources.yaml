apiVersion: v1
kind: Pod
metadata:
  name: good-nonroot
  namespace: production
spec:
  securityContext:
    runAsNonRoot: true
  containers:
    - name: app
      image: ghcr.io/example/app:1.0.0
      securityContext:
        runAsNonRoot: true
---
apiVersion: v1
kind: Pod
metadata:
  name: bad-root
  namespace: production
spec:
  securityContext:
    runAsNonRoot: false
  containers:
    - name: app
      image: ghcr.io/example/app:1.0.0
      securityContext:
        runAsNonRoot: false
---
apiVersion: v1
kind: Pod
metadata:
  name: missing-security-context
  namespace: production
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.0.0
