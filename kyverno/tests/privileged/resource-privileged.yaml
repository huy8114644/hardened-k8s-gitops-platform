apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged
  namespace: production
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.0.0
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: good-unprivileged
  namespace: production
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.0.0
      securityContext:
        privileged: false
