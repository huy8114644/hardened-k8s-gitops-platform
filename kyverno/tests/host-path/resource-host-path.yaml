apiVersion: v1
kind: Pod
metadata:
  name: bad-host-path
  namespace: production
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.0.0
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
---
apiVersion: v1
kind: Pod
metadata:
  name: good-empty-dir
  namespace: production
spec:
  containers:
    - name: app
      image: ghcr.io/example/app:1.0.0
      volumeMounts:
        - name: scratch
          mountPath: /tmp
  volumes:
    - name: scratch
      emptyDir: {}
