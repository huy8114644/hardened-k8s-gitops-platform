apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-database-tier
  namespace: production
spec:
  podSelector:
    matchLabels:
      tier: database
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: order-api
      ports:
        - protocol: TCP
          port: 5432
  egress: [] # Block all outbound traffic from database tier
